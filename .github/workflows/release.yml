# ddsonic: replaces upstream's release workflow. ddsonic releases one build,
# Linux amd64, from the pinned environment in packaging/Dockerfile.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    if: github.repository == 'DaphnisDuck/ddsonic'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write # create the draft release
      id-token: write # sign the build attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the release files
        run: |
          docker build -t ddsonic-build -f packaging/Dockerfile packaging
          mkdir dist
          docker run --rm -v "$PWD":/src:ro -v "$PWD/dist":/out ddsonic-build \
            /src/packaging/release.sh "$GITHUB_REF_NAME" "$(git log -1 --format=%ct)"

      - name: Install the archive in a fresh container
        env:
          # debian:trixie-slim, by digest. It only runs this check; nothing
          # from it reaches the release files.
          DEBIAN_IMAGE: debian@sha256:a99cfc517144bc59b1978475ec53b46ecabec7e43635402ee5b77cc54cd1b20a
        run: |
          # The tag reaches the container as a variable, never as script text.
          docker run --rm -e TAG="$GITHUB_REF_NAME" -v "$PWD/dist":/dist:ro "$DEBIAN_IMAGE" sh -euc '
            apt-get -qq update && apt-get -qq install -y --no-install-recommends libasound2t64 >/dev/null
            cd /dist && sha256sum -c SHA256SUMS && cd /tmp
            tar -xzf /dist/ddsonic-*-linux-amd64.tar.gz
            install -m 755 ddsonic-*-linux-amd64/ddsonic /usr/local/bin/ddsonic
            ddsonic --version | grep -F -- "$TAG"
            test -s ddsonic-*-linux-amd64/THIRD_PARTY_NOTICES
            test -s ddsonic-*-linux-amd64/LICENSE-GPL-3.0'

      - name: Attest the build
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      # Always a draft: the owner publishes it once the candidate's checks
      # pass. A tag with a hyphen (v1.0.0-rc.1) is marked as a prerelease.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sh packaging/notes.sh "$GITHUB_REF_NAME" > notes.md
          {
            echo
            echo "## Files"
            echo
            echo "The \`ddsonic\` executable is distributed under GPL-3.0; \`ddsonic-*-source.tar.gz\` is the complete corresponding source for this build. Built for Linux x86-64 (glibc 2.36 or newer); tested on Arch and Debian 13."
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
            echo
            echo "Verify the build's provenance with \`gh attestation verify <file> --repo $GITHUB_REPOSITORY\`."
          } >> notes.md
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --draft $prerelease \
            --title "ddsonic $GITHUB_REF_NAME" --notes-file notes.md dist/*
